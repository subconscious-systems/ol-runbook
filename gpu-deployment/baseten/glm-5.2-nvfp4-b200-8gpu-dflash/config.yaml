model_metadata:
  example_model_input:
    messages:
      - role: system
        content: "You are a helpful assistant."
      - role: user
        content: "What does Subconscious.dev do?"
    stream: true
    model: nvidia/glm-5.2-nvfp4
    max_total_tokens: 262144
    temperature: 1.0
  tags:
    - openai-compatible
model_name: Braintree-2
base_image:
  image: subconsciouslabs/sglang-baseten:sm_100-v0.9
secrets:
  DOCKER_REGISTRY_https://index.docker.io/v1/: null
docker_server:
  start_command: >-
    sh -c "GPU_COUNT=$(nvidia-smi --list-gpus | wc -l);
    SGLANG_CACHE_DIR=/opt/sgl-warm-cache/sglang SGLANG_DG_CACHE_DIR=/opt/sgl-warm-cache/deep_gemm FLASHINFER_WORKSPACE_BASE=/opt/sgl-warm-cache/flashinfer HF_HOME=/tmp/hf SGLANG_PP_SPIKE_MODE=on_drop SGLANG_SUBCONSCIOUS_TRANSPLANT=1 SGLANG_SUBCONSCIOUS_BACKTRACK_MAX_LEVELS=1 python3 -m sglang.launch_server \
      --port 8000 --host 0.0.0.0 --tp 8 --model-path /models/glm-5.2-nvfp4 \
      --chat-template /sgl-workspace/sglang/deploy/chat_templates/glm5.2.jinja \
      --tool-call-parser glm47 \
      --subconscious-x-mode \
      --mem-fraction-static 0.82 \
      --enable-hierarchical-cache \
      --hicache-ratio 2 \
      --hicache-io-backend direct \
      --hicache-mem-layout page_first_direct \
      --hicache-write-policy write_back \
      --subconscious-x-st-buffer-size 5 --subconscious-x-min-span-length 3 \
      --speculative-algorithm DFLASH \
      --speculative-draft-model-path SubconsciousDev/glm-5.2-fp8-dflash-v2 \
      --speculative-num-draft-tokens 12 \
      --speculative-draft-kv-cache-dtype bfloat16 \
      --speculative-draft-attention-backend fa4 \
      --subconscious-leaf-only --stream-response-default-include-usage \
      --trust-remote-code --enable-cache-report --cuda-graph-max-bs 96 --cuda-graph-backend-prefill disabled --max-running-requests 96"
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
weights:
  - source: "hf://nvidia/GLM-5.2-NVFP4@aec724e8c7b8ee9db3b48c01c320f63f9cdaf8aa"
    mount_location: "/models/glm-5.2-nvfp4"
    auth_secret_name: "hf_access_token"
resources:
  accelerator: B200:8
  use_gpu: true
runtime:
  predict_concurrency: 48
  health_checks:
    startup_threshold_seconds: 3000
