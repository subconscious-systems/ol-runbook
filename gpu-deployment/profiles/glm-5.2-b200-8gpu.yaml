# Distr → Deployment → App Config → Helm Values (full replace).
#
# Model: nvidia/GLM-5.2-NVFP4 | GPU: b200 | GPUs/node: 8 (tp=8)
# Distr UI (not in this file): namespace sglang, operation-timeout-minutes 120, served-model glm-5.2
# Distr Hub Secrets: WORKER_API_KEY (from api-gateway dashboard), DD_API_KEY (Datadog Agent)
# Chart version: 0.10.0+ (digest-pinned worker image + automatic pre-pull)
# Host bootstrap: ./dependencies.sh

images:
  distrPullSecret:
    enabled: true

datadog:
  enabled: true
  worker:
    env: sglang
    service: sglang-worker-glm-5.2-b200-8gpu
  datadog:
    apiKeyExistingSecret: datadog-secret
    site: datadoghq.com

worker:
  progressDeadlineSeconds: 7200
  hostIPC: true
  profile: local
  auth:
    enabled: true
  service:
    type: NodePort
  image:
    repository: registry.distr.sh/subconscious/timrun
    tag: sm_89-v2
    pullPolicy: IfNotPresent
    prePull:
      enabled: true
  servedModelName: glm-5.2
  modelPath: /models/hf/GLM-5.2-NVFP4
  contextLength: 16384
  gpu:
    enabled: true
    count: 8
  discoveryLabels:
    subconscious.dev/worker-pool: glm-5.2-b200-8gpu
  spreadAcrossNodes: false
  strategy:
    type: Recreate
  terminationGracePeriodSeconds: 180
  sglang:
    enableMetrics: true
    enableMfuMetrics: true
    memFractionStatic: "0.80"
    maxRunningRequests: "32"
    maxTotalTokens: "32768"
    chunkedPrefillSize: "16384"
    extraArgs: >-
      --tp-size 8
      --quantization modelopt_fp4
      --reasoning-parser glm45
      --tool-call-parser glm47
      --trust-remote-code
      --disable-custom-all-reduce
  modelDownload:
    enabled: true
    hfRepo: nvidia/GLM-5.2-NVFP4
    targetPath: /models/hf/GLM-5.2-NVFP4
  extraEnv:
    - name: NCCL_P2P_DISABLE
      value: "1"
    - name: NCCL_IB_DISABLE
      value: "1"
  resources:
    requests:
      cpu: "32"
      memory: "256Gi"
    limits:
      cpu: "64"
      memory: "512Gi"
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  weights:
    csi:
      enabled: false
    hostPath:
      enabled: true
      path: /models/hf
      mountPath: /models/hf
      type: DirectoryOrCreate

models:
  - slug: glm-52
    replicas: 1
    port: 30001
    discoveryLabels:
      subconscious.dev/worker-name: glm-52

secrets:
  create: true
  workerSecretName: worker-secrets
  datadogSecretName: datadog-secret
  worker:
    SGLANG_WORKER_API_KEY: "{{.Secrets.WORKER_API_KEY}}"
  datadog:
    DD_API_KEY: "{{.Secrets.DD_API_KEY}}"
