# Distr → Deployment → App Config → Helm Values (full replace).
#
# Models: zai-org/GLM-5.2-FP8 + SubconsciousDev/glm-5.2-fp8-dflash-v2
# GPU: b200 | GPUs/node: 8 (tp=8)
# Distr UI (not in this file): namespace sglang, operation-timeout-minutes 120, served-model glm-5.2
# Distr Hub Secrets: WORKER_API_KEY, DD_API_KEY, HF_TOKEN (authenticated downloads)
# Chart version: 0.13.0+ (multi-model download + dedicated Hugging Face secret)
# Host bootstrap: ./dependencies.sh

images:
  distrPullSecret:
    enabled: true

# The Distr release has a model-neutral image pin. Clear it for this profile so
# Helm selects the GLM-compatible Blackwell fork below.
releaseImages:
  worker:
    repository: ""
    digest: ""

datadog:
  enabled: true
  worker:
    env: sglang
    service: sglang-worker-glm-5.2-b200-8gpu
  datadog:
    apiKeyExistingSecret: datadog-secret
    site: datadoghq.com

worker:
  progressDeadlineSeconds: 7200
  hostIPC: true
  profile: local
  auth:
    enabled: true
  service:
    type: NodePort
  image:
    repository: registry.distr.sh/subconscious/timrun
    tag: sm_100-v1
    pullPolicy: IfNotPresent
    prePull:
      enabled: true
  servedModelName: glm-5.2
  modelPath: /models/hf/GLM-5.2-FP8
  contextLength: ""
  gpu:
    enabled: true
    count: 8
  discoveryLabels:
    subconscious.dev/worker-pool: glm-5.2-b200-8gpu
  spreadAcrossNodes: false
  strategy:
    type: Recreate
  terminationGracePeriodSeconds: 180
  sglang:
    enableMetrics: true
    enableMfuMetrics: true
    memFractionStatic: "0.80"
    maxRunningRequests: "64"
    maxTotalTokens: ""
    chunkedPrefillSize: ""
    extraArgs: >-
      --tp 8
      --chat-template /sgl-workspace/sglang/deploy/chat_templates/glm5.2.jinja
      --tool-call-parser glm47
      --subconscious-x-mode
      --enable-hierarchical-cache
      --hicache-ratio 3
      --hicache-io-backend direct
      --hicache-mem-layout page_first_direct
      --hicache-write-policy write_back
      --subconscious-x-st-buffer-size 10
      --subconscious-x-min-span-length 2
      --speculative-algorithm DFLASH
      --speculative-draft-model-path /models/hf/glm-5.2-fp8-dflash-v2
      --speculative-num-draft-tokens 12
      --speculative-draft-kv-cache-dtype bfloat16
      --speculative-draft-attention-backend fa4
      --subconscious-leaf-only
      --stream-response-default-include-usage
      --trust-remote-code
      --enable-cache-report
      --cuda-graph-max-bs 64
      --cuda-graph-backend-prefill disabled
      --reasoning-parser glm45
  modelDownload:
    enabled: true
    secretRef: model-download-secrets
    models:
      - hfRepo: zai-org/GLM-5.2-FP8
        targetPath: /models/hf/GLM-5.2-FP8
      - hfRepo: SubconsciousDev/glm-5.2-fp8-dflash-v2
        targetPath: /models/hf/glm-5.2-fp8-dflash-v2
    extraEnv:
      - name: HF_XET_HIGH_PERFORMANCE
        value: "1"
  extraEnv:
    - name: SGLANG_CACHE_DIR
      value: /opt/sgl-warm-cache/sglang
    - name: SGLANG_DG_CACHE_DIR
      value: /opt/sgl-warm-cache/deep_gemm
    - name: FLASHINFER_WORKSPACE_BASE
      value: /opt/sgl-warm-cache/flashinfer
    - name: FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED
      value: "1"
    - name: FLASH_ATTENTION_CUTE_DSL_CACHE_DIR
      value: /opt/sgl-warm-cache/fa4
    - name: TRITON_CACHE_DIR
      value: /opt/sgl-warm-cache/triton
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /opt/sgl-warm-cache/torch-inductor
    - name: TVM_FFI_CACHE_DIR
      value: /opt/sgl-warm-cache/tvm-ffi
    - name: HF_HOME
      value: /models/hf/.cache/huggingface
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: SGLANG_PP_SPIKE_MODE
      value: on_drop
    - name: SGLANG_SUBCONSCIOUS_TRANSPLANT
      value: "1"
    - name: SGLANG_SUBCONSCIOUS_BACKTRACK_MAX_LEVELS
      value: "1"
  resources:
    requests:
      cpu: "64"
      memory: "1363149Mi"
    limits:
      cpu: "64"
      memory: "1363149Mi"
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  weights:
    csi:
      enabled: false
    hostPath:
      enabled: true
      path: /models/hf
      mountPath: /models/hf
      type: DirectoryOrCreate

models:
  - slug: glm-52
    replicas: 1
    port: 30001
    discoveryLabels:
      subconscious.dev/worker-name: glm-52

secrets:
  create: true
  workerSecretName: worker-secrets
  datadogSecretName: datadog-secret
  modelDownloadSecretName: model-download-secrets
  worker:
    SGLANG_WORKER_API_KEY: "{{.Secrets.WORKER_API_KEY}}"
  datadog:
    DD_API_KEY: "{{.Secrets.DD_API_KEY}}"
  modelDownload:
    HF_TOKEN: "{{.Secrets.HF_TOKEN}}"
