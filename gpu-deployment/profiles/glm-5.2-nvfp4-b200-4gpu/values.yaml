# Distr → Deployment → App Config → Helm Values (full replace).
#
# Host commands (run from this directory):
#   ../install.sh
#   ./weights.sh
#
# Models: nvidia/GLM-5.2-NVFP4 + SubconsciousDev/glm-5.2-fp8-dflash-v2
# GPU: b200 | GPUs/node: 4 (tp=4)
# Preloaded host weights: /mnt/model-test/glm-5.2-nvfp4 + /mnt/model-test/glm-5.2-fp8-dflash-v2
# Route: glm-52 -> NodePort 30001 | served model: glm-5.2
# Requires SGLang application/chart 0.14.0+ for worker.runtimePreset.
# Distr UI (not in this file): namespace sglang, operation-timeout-minutes 120, served-model glm-5.2
# Distr Hub Secrets: WORKER_API_KEY, DD_API_KEY
# Only profile-specific overrides are listed; the chart supplies safe defaults.

images:
  distrPullSecret:
    enabled: true

releaseImages:
  worker:
    repository: ""
    digest: ""

datadog:
  enabled: true
  worker:
    service: sglang-worker-glm-5.2-nvfp4-b200-4gpu
  datadog:
    site: us5.datadoghq.com

worker:
  runtimePreset: glm-5.2-nvfp4-dflash-b200-4gpu
  hostIPC: true
  auth:
    enabled: true
  service:
    type: NodePort
  image:
    repository: registry.distr.sh/subconscious/timrun
    tag: sm_100-v0.13
    prePull:
      enabled: true
  servedModelName: glm-5.2
  modelPath: /mnt/model-test/glm-5.2-nvfp4
  contextLength: ""
  gpu:
    count: 4
  discoveryLabels:
    subconscious.dev/worker-pool: glm-5.2-nvfp4-b200-4gpu
  resources:
    requests:
      cpu: "32"
      memory: "256Gi"
    limits:
      cpu: "32"
      memory: "256Gi"
  weights:
    hostPath:
      enabled: true
      path: /mnt
      mountPath: /mnt
      readOnly: true

models:
  - slug: glm-52
    replicas: 1
    port: 30001
    discoveryLabels:
      subconscious.dev/worker-name: glm-52

secrets:
  create: true
  worker:
    SGLANG_WORKER_API_KEY: "{{.Secrets.WORKER_API_KEY}}"
  datadog:
    DD_API_KEY: "{{.Secrets.DD_API_KEY}}"
